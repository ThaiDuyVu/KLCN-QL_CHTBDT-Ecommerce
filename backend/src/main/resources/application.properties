spring.application.name=backend

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ql-chtbdt-ecommerce
app.jwt.audience=ql-chtbdt-frontend
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d

app.auth-cookie.access-token-cookie-name=ACCESS_TOKEN
app.auth-cookie.refresh-token-cookie-name=REFRESH_TOKEN
app.auth-cookie.csrf-cookie-name=XSRF-TOKEN
app.auth-cookie.csrf-header-name=X-XSRF-TOKEN
app.auth-cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth-cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth-cookie.access-token-path=/
app.auth-cookie.refresh-token-path=/api/auth
app.auth-cookie.domain=${AUTH_COOKIE_DOMAIN:}
app.auth-cookie.access-token-max-age=${app.jwt.access-token-expiration}
app.auth-cookie.refresh-token-max-age=${app.jwt.refresh-token-expiration}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
